name: Desplegar a Cloudflare Workers

# Cada push a main despliega la app y la ruta /parse como un solo Worker.
#
# Mientras `wrangler.jsonc` no declare `routes`, el despliegue publica solo en
# la URL de workers.dev y NO toca diet.gomezh.dev. Ese es el plan por etapas:
# probar en workers.dev con datos de prueba y mover el dominio después, cuando
# la IndexedDB de producción reaparece intacta bajo el mismo origen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      listo: ${{ steps.check.outputs.listo }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Despliegue omitido"
              echo
              echo "Faltan los secrets \`CLOUDFLARE_API_TOKEN\` y/o \`CLOUDFLARE_ACCOUNT_ID\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.listo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:worker
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Resumen
        env:
          SALIDA: ${{ steps.deploy.outputs.command-output }}
        run: |
          url=$(printf '%s' "$SALIDA" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          {
            echo "### Desplegado"
            echo
            [ -n "$url" ] && echo "URL: $url" || echo "Revisa el log para la URL."
          } >> "$GITHUB_STEP_SUMMARY"
