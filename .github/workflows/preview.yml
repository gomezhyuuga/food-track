name: Preview por rama

# Cada push a una rama que no sea de producción sube una VERSIÓN del Worker
# sin promoverla a producción, y registra su Preview URL como environment de
# GitHub. Cada versión recibe su propio subdominio en workers.dev, así que
# conserva la propiedad que importa: origen propio, IndexedDB aparte de la de
# producción. Este workflow nunca promueve nada.

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Un push nuevo sobre la misma rama cancela el preview anterior en vuelo.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Los secrets no se pueden leer en un `if` de job, así que se comprueban aquí
  # y el resultado se pasa como output. Sin credenciales el workflow se salta
  # en verde en vez de fallar en rojo, y no crea un environment vacío.
  gate:
    runs-on: ubuntu-latest
    outputs:
      listo: ${{ steps.check.outputs.listo }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Preview omitido"
              echo
              echo "Faltan los secrets \`CLOUDFLARE_API_TOKEN\` y/o \`CLOUDFLARE_ACCOUNT_ID\`."
              echo "Los pasos de configuración están en \`docs/previews.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: gate
    if: needs.gate.outputs.listo == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.ref_name }}
      url: ${{ steps.url.outputs.preview }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:worker

      - run: npm run build

      - name: Subir versión del Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --message "preview de ${{ github.ref_name }}"

      # El nombre del output varía entre versiones de la action, así que la URL
      # se extrae del texto del comando: es estable aunque el output cambie.
      - name: Extraer la Preview URL
        id: url
        env:
          SALIDA: ${{ steps.deploy.outputs.command-output }}
        run: |
          url=$(printf '%s' "$SALIDA" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          echo "preview=$url" >> "$GITHUB_OUTPUT"

      - name: Resumen
        env:
          PREVIEW: ${{ steps.url.outputs.preview }}
        run: |
          {
            echo "### Preview de \`${{ github.ref_name }}\`"
            echo
            echo "URL: ${PREVIEW:-revisa el log}"
            echo
            echo "Origen propio: IndexedDB y localStorage van aparte de producción."
            echo "Esta versión NO está promovida a producción."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar la URL en el PR, si hay
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMA: ${{ github.ref_name }}
          PREVIEW: ${{ steps.url.outputs.preview }}
        run: |
          pr=$(gh pr list --head "$RAMA" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "Sin PR abierto para esta rama; el preview queda en el environment."
            exit 0
          fi
          body=$(printf '🔎 **Preview de `%s`**\n\n%s\n\nOrigen propio: los datos de prueba no tocan producción. Esta versión no está promovida.' \
            "$RAMA" "$PREVIEW")
          # Reescribe el comentario anterior en vez de acumular uno por push.
          gh pr comment "$pr" --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "$pr" --body "$body"
